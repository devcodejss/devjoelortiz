<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no encontrada · Joel Ortiz Sosa</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#050816">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--blue:#1753eb;--night:#050816}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--night);color:#eef2ff;font-family:'Sora',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;right:-160px;top:-160px;width:460px;height:460px;border-radius:50%;background:var(--blue);filter:blur(130px);opacity:.45;pointer-events:none}
main{position:relative;max-width:520px;text-align:center}
.code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.1em;color:#8ea6ff;text-transform:uppercase}
h1{margin:18px 0 0;font-size:clamp(30px,7vw,48px);font-weight:600;letter-spacing:-.03em;line-height:1.08}
p{margin:18px 0 0;font-size:16px;line-height:1.65;color:#a9b4d6}
a{display:inline-flex;margin-top:32px;padding:14px 26px;border-radius:999px;background:var(--blue);color:#fff;text-decoration:none;font-size:14px;font-weight:500}
a:hover{background:#2f66f5}
</style>
</head>
<body>
<main>
  <div class="code">Error 404</div>
  <h1>Esta página no existe.</h1>
  <p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
  <a href="/">Volver al inicio</a>
</main>
</body>
</html>
